<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>TrueBilt Roofing Logo</title>
  <desc>Bold contractor logo featuring a roofline and TB monogram with TrueBilt Roofing wordmark.</desc>

  <!-- Transparent background -->

  <!-- Icon -->
  <g transform="translate(40,42)">
    <!-- Roof outline -->
    <path d="M22 140 L145 35 L268 140"
          stroke="#F28C28"
          stroke-width="24"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Chimney accent -->
    <path d="M208 72 V28 H246 V104"
          stroke="#F28C28"
          stroke-width="18"
          stroke-linecap="square"
          stroke-linejoin="round"/>

    <!-- Structural monogram -->
    <path d="M88 128 H205"
          stroke="#FFFFFF"
          stroke-width="22"
          stroke-linecap="square"/>
    <path d="M146 127 V255"
          stroke="#FFFFFF"
          stroke-width="22"
          stroke-linecap="square"/>

    <!-- B -->
    <path d="M173 145 H211
             C239 145 254 160 254 181
             C254 196 246 207 232 213
             C250 219 260 232 260 249
             C260 274 242 289 211 289
             H173 Z"
          fill="#FFFFFF"/>

    <!-- Knockouts to define B -->
    <path d="M195 165 H208
             C222 165 230 171 230 181
             C230 191 222 197 208 197
             H195 Z"
          fill="#17212B"/>
    <path d="M195 221 H211
             C227 221 236 228 236 239
             C236 251 227 258 211 258
             H195 Z"
          fill="#17212B"/>

    <!-- Base -->
    <path d="M64 290 H274"
          stroke="#FFFFFF"
          stroke-width="18"
          stroke-linecap="square"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(360,82)">
    <text x="0" y="105"
          font-family="Arial Black, Arial, Helvetica, sans-serif"
          font-size="108"
          font-weight="900"
          letter-spacing="-3"
          fill="#FFFFFF">TRUEBILT</text>

    <!-- Accent rule -->
    <rect x="3" y="132" width="690" height="10" rx="5" fill="#F28C28"/>

    <text x="2" y="210"
          font-family="Arial, Helvetica, sans-serif"
          font-size="52"
          font-weight="700"
          letter-spacing="15"
          fill="#C9D2DA">ROOFING</text>
  </g>
</svg>