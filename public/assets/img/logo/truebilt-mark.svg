        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M14 33.5 L24 25 L34 33.5" fill="none" stroke="#FFFFFF" stroke-width="3.2"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
</svg>
