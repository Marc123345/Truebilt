<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="True Bilt">
  <rect width="48" height="48" rx="11" fill="#1B8A4B"/>
  <!-- layered roof: the upper chevron is the finished system, the lower one the
       deck beneath it — the two-layer idea the whole site is built around -->
